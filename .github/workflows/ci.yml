# Integración continua del frontend (SIGRA).
# Corre en cada push y en cada pull request hacia develop o main.
# Compila, ejecuta pruebas unitarias y deja una compuerta E2E integrada separada.

name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-y-pruebas:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (producción)
        run: npx ng build

      - name: Compilar (desarrollo)
        run: npx ng build --configuration development

      - name: Verificar tipos de aplicación, specs y E2E
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.spec.json
          npm run typecheck:e2e

      - name: Ejecutar las pruebas unitarias
        run: npx ng test --no-watch

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Levantar SSR para smoke HTTP
        run: |
          NG_ALLOWED_HOSTS=localhost,127.0.0.1 node dist/software4-SIGRA-frontend/server/server.mjs > ssr.log 2>&1 &
          echo $! > ssr.pid
          for intento in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ssr.log
          exit 1

      - name: Smoke SSR (allowlist y contingencia API)
        env:
          SIGRA_SSR_URL: http://127.0.0.1:4000
          SIGRA_SSR_ALLOWED_HOSTS: localhost,127.0.0.1
        run: npm run smoke:ssr

      - name: Logs SSR
        if: always()
        run: |
          if [ -f ssr.log ]; then cat ssr.log; fi

  e2e-integrada:
    name: E2E integrada (backend release y PostgreSQL efímero)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=sigra
      DB_USERNAME: postgres
      DB_PASSWORD: ci_only_password
      JWT_SECRET: ci_only_jwt_secret_with_at_least_32_chars_x
      JWT_EXPIRATION_MS: '3600000'
      SERVER_PORT: '8080'
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: 'false'
      SIGRA_E2E_ENABLED: '1'
      SIGRA_E2E_BASE_URL: http://127.0.0.1:4200
      SIGRA_E2E_API_BASE_URL: http://127.0.0.1:8080
      SIGRA_E2E_BACKEND_SHA: de9de7d4d6a8a1182618b7f8c174696a73f7200b
      SIGRA_E2E_POSTGRES_VERSION: '16'
      SIGRA_E2E_SEED_ID: sigra-auth-rbac-release-seed-v1
      SIGRA_E2E_START_FRONTEND: '1'
      SIGRA_E2E_ADMIN_EMAIL: admin.bruno@uco.net.co
      SIGRA_E2E_ADMIN_PASSWORD: 'PasswordSeguro123*'
      SIGRA_E2E_PROFESOR_EMAIL: profesor.bruno@uco.net.co
      SIGRA_E2E_PROFESOR_PASSWORD: 'PasswordSeguro123*'
      SIGRA_E2E_ESTUDIANTE_EMAIL: estudiante.bruno@uco.net.co
      SIGRA_E2E_ESTUDIANTE_PASSWORD: 'PasswordSeguro123*'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el backend release compatible
        uses: actions/checkout@v4
        with:
          repository: juancabernal/software4-SIGRA-backend
          ref: de9de7d4d6a8a1182618b7f8c174696a73f7200b
          path: .ci/backend
          fetch-depth: 1

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Crear esquema y seeds en PostgreSQL efímero
        env:
          PGPASSWORD: ci_only_password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/docs/db/SIGRA_SCHEMA_CURRENT.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/bruno/SIGRA/seed/seed-auth.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/bruno/SIGRA/seed/seed-roles.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/bruno/SIGRA/seed/seed-asignaturas.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/bruno/SIGRA/seed/seed-semestres.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f .ci/backend/bruno/SIGRA/seed/seed-asignaturas-roles.sql

      - name: Compilar backend release
        working-directory: .ci/backend/SIGRA
        run: ./gradlew bootJar --no-daemon

      - name: Levantar backend release
        working-directory: .ci/backend/SIGRA
        run: |
          nohup ./gradlew bootRun --no-daemon > backend-e2e.log 2>&1 &
          echo $! > backend-e2e.pid
          for intento in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat backend-e2e.log
          exit 1

      - name: Validar ambiente E2E, SHA y seed
        run: npm run e2e:preflight

      - name: Instalar Chromium y Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Ejecutar Playwright sin omisiones
        run: npm run e2e

      - name: Publicar reportes Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigra-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Logs del backend E2E
        if: always()
        run: |
          if [ -f .ci/backend/SIGRA/backend-e2e.log ]; then cat .ci/backend/SIGRA/backend-e2e.log; fi
