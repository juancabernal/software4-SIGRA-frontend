<span [class]="clase()">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
    <path
      [attr.d]="apariencia().trazo"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <span>{{ texto() }}</span>
</span>
