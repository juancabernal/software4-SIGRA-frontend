<dialog
  #dialogo
  class="dialogo"
  [attr.aria-labelledby]="idTitulo"
  [attr.aria-describedby]="descripcion() ? idDescripcion : null"
  (cancel)="alCancelarNativo($event)"
>
  <div class="dialogo__contenido">
    <h2 [id]="idTitulo">{{ titulo() }}</h2>
    @if (descripcion()) {
      <p class="dialogo__descripcion" [id]="idDescripcion">{{ descripcion() }}</p>
    }

    @if (error(); as mensaje) {
      <div class="dialogo__error" role="alert">{{ mensaje }}</div>
    }

    @if (gestoRequerido(); as textoGesto) {
      <div class="dialogo__gesto">
        <input
          type="checkbox"
          [id]="idGesto"
          [checked]="gestoAceptado()"
          [disabled]="procesando()"
          (change)="alCambiarGesto($event)"
        />
        <label [for]="idGesto">{{ textoGesto }}</label>
      </div>
    }

    <div class="dialogo__acciones">
      <button
        #botonCancelar
        type="button"
        class="btn"
        [disabled]="procesando()"
        (click)="alCancelar()"
      >
        {{ etiquetaCancelar() }}
      </button>
      <button
        type="button"
        class="btn"
        [class.btn--peligro]="tono() === 'peligro'"
        [class.btn--primario]="tono() === 'normal'"
        [disabled]="confirmarBloqueado()"
        (click)="alConfirmar()"
      >
        {{ procesando() ? 'Procesando…' : etiquetaConfirmar() }}
      </button>
    </div>

    <!-- El cambio de estado del botón de confirmar se anuncia al lector de pantalla (RNF-21). -->
    @if (gestoRequerido()) {
      <p class="solo-lectores" role="status" aria-live="polite">
        {{
          gestoAceptado()
            ? 'Confirmación habilitada.'
            : 'Marca la casilla para habilitar la confirmación.'
        }}
      </p>
    }
  </div>
</dialog>
