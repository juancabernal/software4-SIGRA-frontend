<nav class="paginacion" [attr.aria-label]="'Paginación de ' + elementos()">
  <span class="paginacion__rango tabular">{{ rango() }}</span>

  <div class="paginacion__tamano">
    <label [for]="idTamano">Filas por página</label>
    <select [id]="idTamano" [value]="tamano()" (change)="alCambiarTamano($event)">
      @for (opcion of tamanos(); track opcion) {
        <option [value]="opcion" [selected]="opcion === tamano()">{{ opcion }}</option>
      }
    </select>
  </div>

  <div class="paginacion__controles">
    <button
      type="button"
      class="paginacion__boton"
      aria-label="Página anterior"
      [attr.aria-disabled]="pagina() === 1 ? 'true' : null"
      (click)="anterior()"
    >
      ‹ Anterior
    </button>
    <span class="paginacion__actual tabular" aria-live="polite">
      Página {{ pagina() }} de {{ totalPaginas() }}
    </span>
    <button
      type="button"
      class="paginacion__boton"
      aria-label="Página siguiente"
      [attr.aria-disabled]="pagina() === totalPaginas() ? 'true' : null"
      (click)="siguiente()"
    >
      Siguiente ›
    </button>
  </div>
</nav>
