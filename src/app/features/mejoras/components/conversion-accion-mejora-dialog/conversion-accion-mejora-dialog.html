<app-modal-crud
  [abierto]="abierto()"
  titulo="Convertir en evaluación"
  etiquetaEnviar="Convertir"
  [procesando]="procesando()"
  [error]="errorApi()?.mensaje ?? null"
  [detalles]="errorApi()?.detalles ?? []"
  [enviarDeshabilitado]="enviarDeshabilitado()"
  (enviar)="enviar()"
  (cancelar)="cancelar.emit()"
  (envioBloqueado)="alIntentarEnviarInvalido()"
>
  @if (accion(); as a) {
    <div class="contexto">
      <p class="contexto__etiqueta">Acción de mejora</p>
      <p class="contexto__nombre">{{ a.nombre }}</p>
    </div>
  }

  <div class="campos" [formGroup]="form">
    <div class="campo">
      <label for="conversion-porcentaje"
        >Porcentaje de la evaluación <span class="obligatorio" aria-hidden="true">*</span></label
      >
      <input
        id="conversion-porcentaje"
        type="number"
        formControlName="porcentaje"
        placeholder="Ej. 20"
        min="0"
        max="100"
        step="1"
        aria-required="true"
        [attr.aria-invalid]="mostrarErrorPorcentaje()"
        aria-describedby="conversion-porcentaje-ayuda conversion-porcentaje-error"
      />
      <p class="ayuda" id="conversion-porcentaje-ayuda">Mayor que 0 y máximo 100</p>
      @if (mostrarErrorPorcentaje()) {
        <p class="error-campo" id="conversion-porcentaje-error">
          Escribe un porcentaje mayor que 0 y máximo 100.
        </p>
      }
    </div>
  </div>
</app-modal-crud>
